server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain text/xml;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location ^~ /v1/ {
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;
  }

  location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    try_files $uri =404;
  }

  # The home run derby (isBaseballPath in frontend/src/baseball/baseballRoute.ts) is the one page that may use the
  # camera, so it alone gets a strict policy. try_files serves the file from this location rather than redirecting
  # internally, so these headers stay; merge_slashes sends /baseball// here too. The jsdelivr path mirrors the Pretendard
  # stylesheet in frontend/index.html. Cross-Origin-Opener-Policy keeps a script on another page of this origin from
  # opening this one and reaching into it, so the camera stays with this document.
  location ~ ^/baseball/?$ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' https://cdn.jsdelivr.net/gh/orioncactus/pretendard/; font-src https://cdn.jsdelivr.net/gh/orioncactus/pretendard/; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Every other document, including `/` reaching this one through try_files below, keeps the camera off.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=()" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=()" always;
    try_files $uri $uri/ /index.html;
  }
}
