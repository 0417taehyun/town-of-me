# This file is included inside `http`, so the flood guard's key and zones are declared here, outside `server`. The key
# is an IPv4 address, or the /64 prefix of an IPv6 address, since one client usually holds a whole /64; IPv6 keys always
# carry `v6:`, because an empty key is never counted.
map $remote_addr $game_client_key {
  "~^::ffff:(?<mapped>[0-9.]+)$"                          $mapped;
  "~^(?<v6prefix>[0-9a-f]{0,4}(?::[0-9a-f]{1,4}){0,3})::" "v6:$v6prefix";
  "~^(?<v6prefix>[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){3}):"    "v6:$v6prefix";
  default                                                 $binary_remote_addr;
}
# Flood guards only, which no one person reaches: a ranked run lasts at least about 11 s, and attempts are unlimited.
# The counters live only in these memory zones.
limit_req_zone $game_client_key zone=game_runs:1m rate=1r/s;
limit_req_zone $game_client_key zone=game_api:1m rate=5r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json application/wasm image/svg+xml text/css text/plain text/xml;

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location ^~ /v1/ {
    add_header Cache-Control "no-store" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://backend:3000;

    # The game API, flood-guarded by client address. Its requests write no access log, and a refusal is logged below
    # the error log's level, so client addresses are not kept. The backend refuses bodies over 8 KB on its own too.
    # Nested locations inherit the headers, body size, and logging, but `limit_req` only where they set none, and
    # never `proxy_pass`.
    location ^~ /v1/games/ {
      access_log off;
      limit_req zone=game_api burst=100 nodelay;
      limit_req_status 429;
      limit_req_log_level info;
      client_max_body_size 8k;
      proxy_pass http://backend:3000;

      # Nested because a regex location beside a `^~` prefix is never consulted.
      location ~ ^/v1/games/[a-z][a-z0-9-]*/runs$ {
        limit_req zone=game_runs burst=60 nodelay;
        limit_req zone=game_api burst=100 nodelay;
        proxy_pass http://backend:3000;
      }

      # The town reads its statues on every visit, and the backend marks them public for 60 s. A location with an
      # add_header of its own inherits none from above, so the no-store above stays off this one.
      location ~ ^/v1/games/[a-z][a-z0-9-]*/podium$ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://backend:3000;
      }
    }
  }

  # Vite fingerprints JS, CSS, the Pretendard font subsets (imported in frontend/src/main.tsx), and the MediaPipe wasm
  # and its loader script (`?url` imports in frontend/src/baseball/vision/tasksVision.ts). Without `always` the
  # year-long header goes on successful responses only, so a 404 for a fingerprinted file that is not deployed yet is
  # not cached for a year. The models in /assets/models/ keep their names and fall to the daily rule below.
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|wasm|woff2)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    try_files $uri =404;
  }

  # The home run derby (isBaseballPath in frontend/src/baseball/baseballRoute.ts) is the one page that may use the
  # camera, so it alone gets a strict policy. try_files serves the file from this location rather than redirecting
  # internally, so these headers stay; merge_slashes sends /baseball// here too. Cross-Origin-Opener-Policy keeps a
  # script on another page of this origin from opening this one and reaching into it, so the camera stays with this
  # document. The page asks for video only, and Permissions-Policy makes the browser hold it to that: no microphone, no
  # screen capture.
  location ~ ^/baseball/?$ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), display-capture=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Every other document, including `/` reaching this one through try_files below, keeps the camera off.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=()" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header Permissions-Policy "camera=()" always;
    try_files $uri $uri/ /index.html;
  }
}
