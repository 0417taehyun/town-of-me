# Deployment over compose.yaml on one server: a public address, required secrets, a private seed, and Caddy as the only
# service with a published port, holding the HTTPS certificates. docker/README.md has the steps.
#   docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml up -d --build
x-capped-logs: &capped-logs
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  postgres:
    <<: *capped-logs
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}

  backend:
    <<: *capped-logs
    restart: unless-stopped
    ports: !reset []
    environment:
      ALLOWED_ORIGINS: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}
      FRONTEND_URL: https://${PUBLIC_HOST}/admin
      LINKED_IN_REDIRECT_URI: https://${PUBLIC_HOST}/v1/auth/linkedin/callback
      OPENROUTER_SITE_URL: https://${PUBLIC_HOST}
      TOWN_SEED_PATH: /run/town/town.json
    volumes:
      # Used once, while the database has no town. Without create_host_path a missing file stops the start, where Docker
      # would otherwise create a directory there and the town would never be seeded.
      - type: bind
        source: ${TOWN_SEED_FILE:-./.seed/town.json}
        target: /run/town/town.json
        read_only: true
        bind:
          create_host_path: false

  frontend:
    <<: *capped-logs
    build:
      args:
        VITE_CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${CLOUDFLARE_WEB_ANALYTICS_TOKEN:-}
        SITE_ORIGIN: https://${PUBLIC_HOST}
        SITE_TITLE: ${SITE_TITLE:-}
        SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
    restart: unless-stopped
    ports: !reset []

  caddy:
    <<: *capped-logs
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}
    # IPv4 only: for an IPv6 visitor Docker would hand Caddy its own gateway's address, and every such visitor would share
    # one flood-guard counter.
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and their keys. Losing them means asking Let's Encrypt again, and it limits how often.
      - caddy-data:/data
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy-data:
