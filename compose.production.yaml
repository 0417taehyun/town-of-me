# Deployment over compose.yaml: a public address, required secrets, a private seed, an external PostgreSQL such as Amazon
# RDS, and no published ports, because visitors arrive only through a Cloudflare Tunnel. docker/README.md has the steps.
#   docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml up -d --build
x-capped-logs: &capped-logs
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  # The database lives outside these containers, so the local one never starts.
  postgres:
    profiles: [local-database]

  backend:
    <<: *capped-logs
    restart: unless-stopped
    depends_on: !reset {}
    ports: !reset []
    environment:
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      FRONTEND_URL: ${PUBLIC_ORIGIN}/admin
      LINKED_IN_REDIRECT_URI: ${PUBLIC_ORIGIN}/v1/auth/linkedin/callback
      # RDS signs its certificates with Amazon's own authority, which Node does not trust by default.
      NODE_EXTRA_CA_CERTS: /run/town/database-ca.pem
      OPENROUTER_SITE_URL: ${PUBLIC_ORIGIN}
      TOWN_SEED_PATH: /run/town/town.json
    volumes:
      # Used once, while the database has no town. Without create_host_path a missing file stops the start, where Docker
      # would otherwise create a directory there and the town would never be seeded.
      - type: bind
        source: ${TOWN_SEED_FILE:-./.seed/town.json}
        target: /run/town/town.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATABASE_CA_FILE:-./.seed/database-ca.pem}
        target: /run/town/database-ca.pem
        read_only: true
        bind:
          create_host_path: false

  frontend:
    <<: *capped-logs
    restart: unless-stopped
    ports: !reset []

  cloudflared:
    <<: *capped-logs
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env.production}
    depends_on:
      frontend:
        condition: service_healthy
