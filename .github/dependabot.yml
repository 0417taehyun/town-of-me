version: 2
updates:
  # Both workspaces share one lockfile at the root. Shared tools (ESLint, TypeScript, Prettier) bump both modules'
  # package.json in one pull request, which the module-scope check allows for dependency-only changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # A tasks-vision or Pretendard bump arrives alone and gets the zero-external-request check; a Pretendard bump
        # also updates its row in frontend/public/assets/CREDITS.md and Pretendard-LICENSE.txt.
        exclude-patterns: ['@mediapipe/*', 'pretendard']
    ignore:
      # typescript-eslint supports TypeScript below 6.1, and TypeScript minor releases can break it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # @mediapipe/tasks-vision 1.0.0 and later send usage logs to Google; /baseball pins 0.10.35
      # (see frontend/src/baseball/vision/tasksVision.ts).
      - dependency-name: '@mediapipe/tasks-vision'
        versions: ['>=1.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Docker base images are left out: tags such as node:26-alpine already pull the latest patch on a fresh build, and
  # Node majors are moved by hand between LTS releases.
