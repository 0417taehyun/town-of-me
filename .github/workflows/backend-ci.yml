name: Backend CI

on:
  push:
    paths:
      - backend/**
      - package.json
      - package-lock.json
      - .prettierrc.json
      - eslint.codeStyle.mjs
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - backend/**
      - package.json
      - package-lock.json
      - .prettierrc.json
      - eslint.codeStyle.mjs
      - .github/workflows/backend-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: town_of_me_test
          POSTGRES_USER: town_of_me
          POSTGRES_PASSWORD: town_of_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U town_of_me -d town_of_me_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://town_of_me:town_of_me@localhost:5432/town_of_me_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace backend
      - run: npm run format:check --workspace backend
      - run: npm test --workspace backend
      - run: npm run build --workspace backend
